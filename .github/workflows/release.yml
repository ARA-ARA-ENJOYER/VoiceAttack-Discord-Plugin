name: Release

# Build the plugin + single-file setup wizard and attach them to a GitHub Release.
# Usage (maintainer): git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Pinned to commit SHAs (supply-chain hardening); comments record the moving tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore (locked)
        run: dotnet restore VoiceAttackDiscordPlugin.sln --locked-mode

      - name: Build solution (Release)
        run: dotnet build VoiceAttackDiscordPlugin.sln -c Release --no-restore --nologo

      - name: Run tests
        run: dotnet test VoiceAttackDiscordPlugin.Tests/VoiceAttackDiscordPlugin.Tests.csproj -c Release --no-build --nologo

      - name: Publish setup wizard (single file, self-contained)
        run: >
          dotnet publish Setup/VoiceAttackDiscordPlugin.Setup.csproj -c Release
          -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Stage portable plugin folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/VoiceAttackDiscordPlugin | Out-Null
          Copy-Item VoiceAttackDiscordPlugin/bin/Release/net8.0/* portable/VoiceAttackDiscordPlugin/
          Copy-Item VoiceAttackDiscordPlugin/config.example.json portable/VoiceAttackDiscordPlugin/
          Copy-Item publish/VoiceAttack-Discord-Plugin-Setup.exe portable/
          Copy-Item README.md, SETUP.md portable/

      - name: Extract changelog section for release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)"
          $section = ""
          if ($changelog -match $pattern) { $section = $matches[1].Trim() }
          if ([string]::IsNullOrWhiteSpace($section)) { $section = "See CHANGELOG.md for details." }
          $header = @("## What's new in ${{ github.ref_name }}", "", $section, "")
          Set-Content -Path release-notes.md -Value ($header -join "`r`n")

      - name: Zip portable package + checksums
        shell: pwsh
        run: |
          Compress-Archive -Path portable/* -DestinationPath VoiceAttack-Discord-Plugin-portable.zip
          $files = @(
            "publish/VoiceAttack-Discord-Plugin-Setup.exe",
            "VoiceAttack-Discord-Plugin-portable.zip"
          )
          $sums = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash, (Split-Path $f -Leaf) }
          Set-Content -Path SHA256SUMS.txt -Value $sums
          $existing = Get-Content release-notes.md -Raw
          $notes = @(
            $existing.TrimEnd(),
            "",
            "One-click install: download VoiceAttack-Discord-Plugin-Setup.exe, double-click it, and follow the wizard.",
            "If Windows shows 'Windows protected your PC', that's normal for unsigned open-source apps: click 'More info' then 'Run anyway'.",
            "",
            "Verify a download (PowerShell): Get-FileHash <file> -Algorithm SHA256, then compare with SHA256SUMS.txt.",
            "",
            "## SHA256",
            "",
            '```',
            ($sums -join "`r`n"),
            '```'
          )
          Set-Content -Path release-notes.md -Value ($notes -join "`r`n")

      - name: Create GitHub Release
        shell: pwsh
        run: >
          gh release create "${{ github.ref_name }}"
          VoiceAttack-Discord-Plugin-portable.zip
          publish/VoiceAttack-Discord-Plugin-Setup.exe
          SHA256SUMS.txt
          --title "VoiceAttack Discord Plugin ${{ github.ref_name }}"
          --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
