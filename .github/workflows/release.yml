name: Release

# Build the plugin + single-file setup wizard and attach them to a GitHub Release.
# Usage (maintainer): git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build plugin (Release)
        run: dotnet build VoiceAttackDiscordPlugin/VoiceAttackDiscordPlugin.csproj -c Release --nologo

      - name: Publish setup wizard (single file, self-contained)
        run: >
          dotnet publish Setup/VoiceAttackDiscordPlugin.Setup.csproj -c Release
          -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Stage portable plugin folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/VA.VoiceAttackDiscordPlugin | Out-Null
          Copy-Item VoiceAttackDiscordPlugin/bin/Release/net8.0/* portable/VA.VoiceAttackDiscordPlugin/
          Copy-Item VoiceAttackDiscordPlugin/config.example.json portable/VA.VoiceAttackDiscordPlugin/
          Copy-Item publish/VoiceAttack-Discord-Plugin-Setup.exe portable/
          Copy-Item README.md, SETUP.md portable/

      - name: Zip portable package
        shell: pwsh
        run: Compress-Archive -Path portable/* -DestinationPath VoiceAttack-Discord-Plugin-portable.zip

      - name: Create GitHub Release
        shell: pwsh
        run: >
          gh release create "${{ github.ref_name }}"
          VoiceAttack-Discord-Plugin-portable.zip
          publish/VoiceAttack-Discord-Plugin-Setup.exe
          --title "VoiceAttack Discord Plugin ${{ github.ref_name }}"
          --notes "One-click install: download VoiceAttack-Discord-Plugin-Setup.exe, double-click it, and follow the wizard."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
